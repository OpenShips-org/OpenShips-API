name: Build API

on:
  push:
    branches:
      - master
    paths:
      - "OpenShips-API/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./OpenShips-API/Dockerfile
          push: true
          tags: |
            ghcr.io/openships-org/openships-api:latest
            ghcr.io/openships-org/openships-api:${{ github.sha }}