services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  openships-api:
    image: ghcr.io/openships-org/openships-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ApiKeys__Pelyr: "${APIKEYS_PELYR}"
      ApiKeys__AisStream: "${APIKEYS_AISSTREAM}"
    ports:
      - "5018:8080"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    
  port-import:
    image: ghcr.io/openships-org/openships-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    command: [ "--import-ports" ]
    
  frontend:
    image: ghcr.io/alexius25/openships-frontend:latest
    ports:
      - "3000:3000"
    environment:
      API_URL: "https://api.openships.de"
      VESSELS_MAX_AGE_MINUTES: "60"
    restart: unless-stopped

volumes:
  postgres-data: